name: Fix NOTA 001 documents

on:
  push:
    branches:
      - nota-001-pollo-produccion-planilla

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nota-001-pollo-produccion-planilla
      - name: Add image and PDF boleta support
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          t=p.read_text(encoding='utf-8')
          old="setupProduction();setupActivityModal();setupWeekly();addModals();"
          new="""setupProduction();setupActivityModal();setupWeekly();addModals();
if($('lPhotos')){
  $('lPhotos').setAttribute('accept','image/*,.pdf,application/pdf');
  $('lPhotos').onchange=async e=>{pendingPhotos=[];$('photoPreview').innerHTML='';for(const f of e.target.files){let data=await new Promise(res=>{let r=new FileReader();r.onload=()=>res(r.result);r.readAsDataURL(f)}),doc={data,name:f.name,type:f.type||''};pendingPhotos.push(doc);if(doc.type.startsWith('image/')){let im=document.createElement('img');im.src=data;im.alt=f.name;$('photoPreview').appendChild(im)}else{let d=document.createElement('div');d.className='notice';d.textContent='Documento: '+f.name;$('photoPreview').appendChild(d)}}};
}"""
          if old not in t: raise SystemExit('No se encontró punto de integración de archivos')
          t=t.replace(old,new,1)
          old2="let photos=(e.photos||[]).map((p,i)=>`<img src=\"${typeof p==='string'?p:p.data}\" alt=\"Boleta ${i+1}\">`).join('');"
          new2="let photos=(e.photos||[]).map((p,i)=>{let data=typeof p==='string'?p:p.data,type=typeof p==='string'?(String(p).startsWith('data:image/')?'image/legacy':''):p.type||'',name=typeof p==='string'?`Boleta ${i+1}`:(p.name||`Documento ${i+1}`);return type.startsWith('image/')?`<img src=\"${data}\" alt=\"${name}\">`:`<a class=\"btn outline\" href=\"${data}\" target=\"_blank\" rel=\"noopener\">Abrir ${name}</a>`}).join('');"
          if old2 not in t: raise SystemExit('No se encontró render actual de archivos de boleta')
          t=t.replace(old2,new2,1)
          p.write_text(t,encoding='utf-8')
          PY
          python3 - <<'PY'
          from pathlib import Path
          import re
          t=Path('index.html').read_text(encoding='utf-8')
          assert "image/*,.pdf,application/pdf" in t
          assert "Documento: " in t
          assert "Abrir ${name}" in t
          blocks=re.findall(r'<script(?![^>]*\\bsrc=)[^>]*>(.*?)</script>',t,re.S|re.I)
          for i,b in enumerate(blocks): Path(f'/tmp/viyedi-doc-{i}.js').write_text(b,encoding='utf-8')
          PY
          for f in /tmp/viyedi-doc-*.js; do node --check "$f"; done
          rm -f .github/workflows/fix-nota001-documents.yml
      - name: Commit validated document support
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github || true
          git diff --cached --quiet && exit 0
          git commit -m "fix: admitir imágenes y PDF en boletas"
          git push origin HEAD:nota-001-pollo-produccion-planilla
