name: Fix NOTA 001 documents v2

on:
  push:
    branches:
      - nota-001-pollo-produccion-planilla

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nota-001-pollo-produccion-planilla
      - name: Add image and PDF boleta support
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64
          p=Path('index.html')
          t=p.read_text(encoding='utf-8')
          marker="setupProduction();setupActivityModal();setupWeekly();addModals();"
          insert=base64.b64decode('').decode()
          old2=base64.b64decode('bGV0IHBob3Rvcz0oZS5waG90b3N8fFtdKS5tYXAoKHAsaSk9PmA8aW1nIHNyYz0iJHt0eXBlb2YgcD09PSdzdHJpbmcnP3A6cC5kYXRhfSIgYWx0PSJCb2xldGEgJHtpKzF9Ij5gKS5qb2luKCcnKTs=').decode()
          new2=base64.b64decode('').decode()
          if "image/*,.pdf,application/pdf" not in t:
              if marker not in t: raise SystemExit('No se encontró punto de integración de archivos')
              t=t.replace(marker,marker+'\n'+insert,1)
          if old2 in t:
              t=t.replace(old2,new2,1)
          elif new2 not in t:
              raise SystemExit('No se encontró render actual de archivos de boleta')
          p.write_text(t,encoding='utf-8')
          PY
          python3 - <<'PY'
          from pathlib import Path
          import re
          t=Path('index.html').read_text(encoding='utf-8')
          assert "image/*,.pdf,application/pdf" in t
          assert "Documento: " in t
          assert "Abrir ${name}" in t
          blocks=re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>',t,re.S|re.I)
          for i,b in enumerate(blocks): Path(f'/tmp/viyedi-doc-{i}.js').write_text(b,encoding='utf-8')
          PY
          for f in /tmp/viyedi-doc-*.js; do node --check "$f"; done
          rm -f .github/workflows/fix-nota001-documents-v2.yml
      - name: Commit validated document support
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github || true
          git diff --cached --quiet && exit 0
          git commit -m "fix: admitir imágenes y PDF en boletas"
          git push origin HEAD:nota-001-pollo-produccion-planilla
