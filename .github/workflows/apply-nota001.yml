name: Apply NOTA 001

on:
  push:
    branches:
      - nota-001-pollo-produccion-planilla

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nota-001-pollo-produccion-planilla
      - name: Integrate NOTA 001 into canonical index
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .github/nota001_module.js.gz.b64 | gzip -d > /tmp/nota001.js
          node --check /tmp/nota001.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          text=p.read_text(encoding='utf-8')
          module=Path('/tmp/nota001.js').read_text(encoding='utf-8')
          marker='NOTA001_INTEGRADA'
          if marker not in text:
              if '</body>' not in text:
                  raise SystemExit('No se encontró </body>')
              text=text.replace('</body>', '<script>\n'+module+'\n</script>\n</body>', 1)
              p.write_text(text, encoding='utf-8')
          PY
          python3 - <<'PY'
          from pathlib import Path
          import re
          t=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>',t,re.S|re.I)
          if not blocks:
              raise SystemExit('No se encontraron scripts inline')
          for i,b in enumerate(blocks):
              Path(f'/tmp/viyedi-script-{i}.js').write_text(b,encoding='utf-8')
          print(len(blocks))
          PY
          for f in /tmp/viyedi-script-*.js; do node --check "$f"; done
          grep -q 'NOTA001_INTEGRADA' index.html
          grep -q 'Control pollo vivo vs. pollo pelado' index.html
          grep -q 'Planilla principal' index.html
          rm -f .github/nota001_module.js.gz.b64 .github/workflows/apply-nota001.yml
      - name: Commit validated change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github || true
          git diff --cached --quiet && exit 0
          git commit -m "feat: integrar NOTA 001 pollo vivo producción y planilla"
          git push origin HEAD:nota-001-pollo-produccion-planilla
