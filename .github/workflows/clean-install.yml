name: Clean VIYEDI demo data

on:
  push:
    branches:
      - limpiar-instalacion

permissions:
  contents: write

jobs:
  clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: limpiar-instalacion

      - name: Apply surgical clean-install patch
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          old_key = 'viyediControlState‐v2'
          new_key = 'viyediControlState_clean_v1'
          assert text.count(old_key) == 2, f'Expected 2 state-key occurrences, found {text.count(old_key)}'
          text = text.replace(old_key, new_key)

          old_seed = """branches:[{name:'Cotoca',manager:'Por definir'},{name:'La Pampa',manager:'Mayra'},{name:'Mercado Retoño',manager:'Por definir'}],
          workers:[{name:'José Mamani',section:'Matador',branch:'Matadero',rate:'Bs 0,14 / pollo'},{name:'Mario Rodríguez',section:'Pelador',branch:'Matadero',rate:'Pendiente'}],
          users:[{name:'Victor',username:'victor28',branch:'Todas',perms:['Todo'],status:'Activo'}],
          clients:[{name:'Gladys Pérez',market:'La Pampa',phone:'+59170000001',balance:3200},{name:'Gabi Flores',market:'Cotoca',phone:'+59170000002',balance:7000}],
          requests:[],payments:[],money:[],advances:[],discounts:[],
          dispatches:[{date:today(),time:'09:18',dest:'La Pampa',boxes:25,kg:548.3,price:19.5,status:'Entregado'},{date:today(),time:'08:41',dest:'Cotoca',boxes:18,kg:388.2,price:19.5,status:'Entregado'}],
          liveEntries:[],activities:[],notifications:[]"""

          new_seed = """branches:[],
          workers:[],
          users:[],
          clients:[],
          requests:[],payments:[],money:[],advances:[],discounts:[],
          dispatches:[],
          liveEntries:[],activities:[],notifications:[]"""

          assert text.count(old_seed) == 1, 'Demo seed block did not match exactly; refusing to edit'
          text = text.replace(old_seed, new_seed, 1)

          replacements = {
              '<input id="pBy" value="Mayra">': '<input id="pBy">',
              '<input id="mBy" value="Mayra">': '<input id="mBy">',
              "by:'Mayra',status:'Pendiente'": "by:'Sin identificar',status:'Pendiente'",
          }
          for old, new in replacements.items():
              assert text.count(old) == 1, f'Expected exactly one occurrence of: {old}'
              text = text.replace(old, new, 1)

          forbidden = ['José Mamani', 'Mario Rodríguez', 'Gladys Pérez', 'Gabi Flores', 'Mercado Retoño', 'La Pampa', 'Cotoca', 'Mayra']
          leftovers = [name for name in forbidden if name in text]
          assert not leftovers, f'Demo names remain: {leftovers}'
          assert text.count(new_key) == 2

          path.write_text(text, encoding='utf-8')

      - name: Validate inline JavaScript syntax
        shell: python
        run: |
          from pathlib import Path
          import re
          html = Path('index.html').read_text(encoding='utf-8')
          scripts = []
          for match in re.finditer(r'<script(?P<attrs>[^>]*)>(?P<body>.*?)</script>', html, flags=re.S|re.I):
              if 'src=' not in match.group('attrs').lower():
                  scripts.append(match.group('body'))
          Path('/tmp/viyedi-inline.js').write_text('\n'.join(scripts), encoding='utf-8')
      - name: Node syntax check
        run: node --check /tmp/viyedi-inline.js

      - name: Commit cleaned index only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "feat: dejar instalación inicial sin datos demo"
          git push origin limpiar-instalacion
